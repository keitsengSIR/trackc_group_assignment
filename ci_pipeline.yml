name: COMP 441 Track C CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov scikit-learn
        
    - name: Run Unit and Integration Tests with Coverage Gate
      run: |
        pytest --cov=./ --cov-fail-under=75
        
    - name: Run ML Defect Predictor Script Check
      run: |
        python ml_defect_prediction/train_defect_model.py